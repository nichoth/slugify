<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slugify</title>
    <meta name="description" content="Slugify a string. Type some text to see the slug.">
</head>
<body>
    <main>
        <h1>slugify</h1>
        <p class="tagline">Slugify a string.</p>

        <div class="demo">
            <label for="text-input">Text</label>
            <input
                id="text-input"
                name="text"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                value="I &hearts; Dogs"
            >

            <span class="output-label" id="output-label">Slug</span>
            <output
                id="output"
                for="text-input"
                aria-labelledby="output-label"
            ></output>
        </div>
    </main>

    <script type="module" src="./index.ts"></script>
</body>
</html>
